name: R checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
      - name: Check packaged script and app regressions
        shell: Rscript {0}
        run: |
          source("tools/sync-app.R")
          for (suite in c("regression", "source-context", "assignment-context", "image-reading", "conversation-context", "conversation-history")) {
            status <- system2(file.path(R.home("bin"), "Rscript"), paste0("tests/", suite, ".R"))
            if (status != 0L) stop("Failed: ", suite)
          }
      - name: Check snapshot has no uncommitted changes
        run: git diff --exit-code -- inst/app/AISource.R
      - uses: r-lib/actions/check-r-package@v2
        with:
          args: 'c("--no-manual")'
          error-on: '"warning"'
