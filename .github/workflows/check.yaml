name: Local source on Windows
on:
  push:
    branches: [codex/verify-local-windows-20261019]
permissions:
  contents: read
jobs:
  local-windows:
    runs-on: windows-latest
    env:
      RASSISTANT_REQUIRE_PDFTOOLS: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.6.1'
          use-public-rspm: true
      - name: Install CRAN binaries for the standalone script
        shell: Rscript {0}
        run: |
          stopifnot(!requireNamespace("RAssistant", quietly = TRUE))
          source("R Assistant Local/Setup.R", encoding = "UTF-8")
          install.packages("chromote", repos = "https://cloud.r-project.org", type = "binary")
      - name: Verify local launch, native credentials and regressions
        shell: Rscript {0}
        run: |
          setwd("R Assistant Local")
          Sys.unsetenv("OPENAI_API_KEY")
          for (suite in c("startup", "windows-paths", "regression", "source-context", "assignment-context", "image-reading", "conversation-context", "document-upload")) {
            status <- system2(file.path(R.home("bin"), "Rscript.exe"), c(paste0("tests/", suite, ".R")))
            if (status != 0L) stop("Failed: ", suite)
          }
          stopifnot(!"RAssistant" %in% loadedNamespaces())
      - name: Verify upload, preview and Copy in Chrome
        shell: Rscript {0}
        run: |
          setwd("R Assistant Local")
          chrome <- file.path(Sys.getenv("ProgramFiles"), "Google", "Chrome", "Application", "chrome.exe")
          stopifnot(file.exists(chrome))
          Sys.setenv(CHROMOTE_CHROME = chrome)
          source("tests/browser.R", encoding = "UTF-8")
