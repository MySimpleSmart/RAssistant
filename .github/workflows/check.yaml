name: R checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ${{ matrix.os }}
    env:
      # Fail rather than skip the PDF knowledge checks when pdftools is missing.
      RASSISTANT_REQUIRE_PDFTOOLS: "true"
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::rcmdcheck
            any::pdftools
      - name: Check packaged script and app regressions
        shell: Rscript {0}
        run: |
          source("tools/sync-app.R")
          for (suite in c("regression", "source-context", "source-edits", "source-workflow", "source-advanced", "source-restore", "source-smart", "source-auto", "workspace-data", "assignment-context", "image-reading", "conversation-context", "conversation-history", "console-context", "console-source", "console-request", "plot-attachment", "knowledge-context", "knowledge-work")) {
            status <- system2(file.path(R.home("bin"), "Rscript"), paste0("tests/", suite, ".R"))
            if (status != 0L) stop("Failed: ", suite)
          }
      - name: Check snapshot has no uncommitted changes
        run: git diff --exit-code -- inst/app/AISource.R DESCRIPTION
      - uses: r-lib/actions/check-r-package@v2
        with:
          args: 'c("--no-manual")'
          error-on: '"warning"'
